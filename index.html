<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minglo Selfie</title>
<meta name="theme-color" content="#0a090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minglo Selfie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/minglo.css">
<link rel="stylesheet" href="css/booth.css">
</head>
<body>
<div id="app" data-screen="attract">

  <!-- Baggrund: sløret live-kamera + stemningslys -->
  <div class="bg">
    <video id="bgcam" playsinline muted aria-hidden="true"></video>
    <div class="aura"><i></i><i></i><i></i></div>
    <div class="veil"></div>
  </div>

  <!-- 1 · Velkomst -->
  <section class="screen" id="s-attract" aria-label="Velkommen">
    <header class="attract-top">
      <span class="wordmark" id="brand" data-brand>minglo</span>
    </header>
    <div class="attract-mid">
      <p class="eyebrow">Selfie booth</p>
      <h1 class="display" id="evName"></h1>
      <p class="ev-date" id="evDate"></p>
    </div>
    <div class="cta">
      <span class="cta-ring">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.2-1.8h6.2L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.500 19h-11A2.5 2.5 0 0 1 4 16.500z"/><circle cx="12" cy="12.500" r="3.4"/></svg>
      </span>
      <span class="cta-label">Tryk for at starte</span>
    </div>
  </section>

  <!-- 2 · Optagelse -->
  <section class="screen" id="s-shoot" aria-label="Tag et billede">
    <div class="shoot-top">
      <button class="icon-btn" id="backBtn" aria-label="Tilbage til start">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="wordmark" data-brand>minglo</span>
      <span class="icon-btn-space"></span>
    </div>

    <div class="finder-wrap">
      <div class="finder" id="finder">
        <video id="cam" playsinline muted></video>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div class="count" id="count" aria-live="assertive"></div>
        <div class="finder-msg" id="finderMsg"></div>
        <div class="shots" id="shots"></div>
      </div>
    </div>

    <div class="controls">
      <div class="seg" id="modeSeg" role="radiogroup" aria-label="Vælg format"></div>
      <div class="chips" id="filterChips" role="radiogroup" aria-label="Vælg look"></div>
      <button class="shutter" id="shutter" aria-label="Tag billede"><span></span></button>
      <p class="hint" id="hint">Tryk — og smil</p>
    </div>
  </section>

  <!-- 3 · Se billedet -->
  <section class="screen" id="s-review" aria-label="Se dit billede">
    <div class="review-head">
      <p class="eyebrow">Sådan</p>
      <h2 class="display">I ser <span class="fest-text">fantastiske</span> ud</h2>
    </div>
    <div class="print-wrap"><img class="print" id="reviewImg" alt="Dit billede"></div>
    <div class="actions">
      <button class="btn btn-glass" id="retake">Tag om</button>
      <button class="btn btn-fest" id="keep">Behold billedet</button>
    </div>
    <div class="timerbar"><i id="reviewTimer"></i></div>
  </section>

  <!-- 4 · Del -->
  <section class="screen" id="s-share" aria-label="Hent dit billede">
    <div class="print-wrap share-print"><img class="print" id="shareImg" alt="Dit billede"></div>
    <div class="share-side">
      <p class="eyebrow">Gemt</p>
      <h2 class="display" id="shareTitle">Tag det med hjem</h2>
      <div class="qr-card" id="qrCard">
        <div class="qr" id="qr"></div>
        <p>Scan med mobilens kamera</p>
      </div>
      <p class="share-note" id="shareNote"></p>
      <button class="btn btn-fest" id="done">Færdig</button>
    </div>
    <div class="timerbar"><i id="shareTimer"></i></div>
  </section>

  <div class="flash" id="flash"></div>
  <canvas class="confetti" id="confetti"></canvas>

  <!-- Kamera-fejl -->
  <div class="cam-error" id="camError" hidden>
    <p class="eyebrow">Kamera</p>
    <h2 class="display">Vi mangler lige kameraet</h2>
    <p id="camErrorText">Giv adgang til kameraet for at komme i gang.</p>
    <button class="btn btn-fest" id="camRetry">Prøv igen</button>
  </div>

  <div id="adminRoot"></div>
</div>
<script type="module" src="js/booth.js"></script>
</body>
</html>
